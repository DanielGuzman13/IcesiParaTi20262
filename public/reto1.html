<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reto 1: Detecta al Impostor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a1120; --card:#101a2e; --card-border:rgba(148,180,230,.16); --ink:#eef2fb; --muted:#8090ac; --teal:#5eead4; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Space Grotesk',sans-serif; display:flex; justify-content:center; padding:28px 18px 60px;}
  .wrap{ width:100%; max-width:440px; }
  h1{ font-size:1.25rem; margin-bottom:6px;}
  p.sub{ color:var(--muted); font-size:.88rem; margin:0 0 18px; line-height:1.5;}
  .banner{ font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--teal); margin-bottom:18px;}
  label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--teal); margin:16px 0 6px;}
  input{ width:100%; padding:11px 13px; border-radius:10px; background:var(--card); border:1px solid var(--card-border); color:var(--ink); font-family:'Space Grotesk',sans-serif; font-size:.92rem; }
  button{ margin-top:20px; width:100%; padding:14px; border-radius:10px; border:none; background:var(--teal); color:#062019; font-weight:700; font-size:.95rem; cursor:pointer; }
  button:disabled{ opacity:.6; }
  .result{ display:none; margin-top:22px; padding:20px; border-radius:14px; background:var(--card); border:1px solid rgba(94,234,212,.35); text-align:center;}
  .err{ color:#f2705e; font-size:.82rem; margin-top:10px; min-height:1em;}
  .need-avatar{ display:none; text-align:center; padding:30px 20px; background:var(--card); border:1px solid var(--card-border); border-radius:14px;}
  .need-avatar p{ color:var(--muted); font-size:.88rem; line-height:1.5;}
  .need-avatar a{ display:inline-block; margin-top:14px; padding:12px 22px; background:var(--teal); color:#062019; border-radius:10px; text-decoration:none; font-weight:700; font-size:.9rem;}
</style>
</head>
<body>
<a href="/" style="position:fixed;top:14px;left:14px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);text-decoration:none;border:1px solid var(--card-border);padding:6px 10px;border-radius:8px;background:var(--card);z-index:50;">← Inicio</a>
<div class="wrap">
  <h1>🕵️ Reto 1: Detecta al Impostor</h1>
  <p class="sub">Uno de los dos textos que mostró el presentador lo escribió una IA. ¿Cuál fue?</p>
  <div class="banner" id="banner"></div>

  <div class="need-avatar" id="needAvatar">
    <p>Primero necesitas crear tu avatar para que el sistema te reconozca en esta actividad.</p>
    <a href="/avatar-form.html">Crear mi avatar</a>
  </div>

  <div id="formArea">
    <label>Respuesta</label>
    <input id="answer" type="text" placeholder="Escribe A o B">
    <button id="sendBtn">Enviar respuesta</button>
    <div class="err" id="err"></div>
  </div>

  <div class="result" id="result">
    <p>Respuesta registrada 🛰️ Mira el marcador en pantalla.</p>
  </div>
</div>

<script>
  const personName = (function(){ try{ return localStorage.getItem('icesiPersonName') || ''; }catch(e){ return ''; } })();
  if (!personName){
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('needAvatar').style.display = 'block';
  } else {
    document.getElementById('banner').textContent = 'Conectado como: ' + personName;
  }

  const sendBtn = document.getElementById('sendBtn');
  const err = document.getElementById('err');
  sendBtn.addEventListener('click', async () => {
    const answer = document.getElementById('answer').value.trim();
    if (!answer){ err.textContent = 'Escribe una respuesta.'; return; }
    err.textContent = '';
    sendBtn.disabled = true; sendBtn.textContent = 'Enviando...';
    try{
      const res = await fetch('/api/round', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: personName, round: 'r1', answer }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error');
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('result').style.display = 'block';
    }catch(e){
      err.textContent = 'No se pudo enviar. Intenta de nuevo.';
      sendBtn.disabled = false; sendBtn.textContent = 'Enviar respuesta';
    }
  });
</script>
</body>
</html>
